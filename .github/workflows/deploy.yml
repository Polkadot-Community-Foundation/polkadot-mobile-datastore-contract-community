name: Deploy AccountDataStore

# One workflow, two GitHub environments. Each environment holds its own deployer
# secret and endpoint variable, so a devnet run can never sign with the production key.
#   secret   DEPLOYER_MNEMONIC   sr25519 deployer (BIP-39), signer=mnemonic
#   variable SUBSTRATE_WS_URL    optional; overrides the network preset endpoint
#   variable CONTRACT_ADDRESS    set once deployed; blocks an accidental second instance
# signer=kms signs through ETH-RPC with the Cloud KMS key contract-deployer (live) or
# contract-deployer-rehearsal (fork), reached through workload identity:
#   variables GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT, GCP_PROJECT_ID, GCP_LOCATION,
#             GCP_KEY_RING, optional GCP_KEY_VERSION (default 1), optional ETH_RPC_IMAGE
# mode=fork deploys on a chopsticks fork of live Polkadot Asset Hub inside the job; nothing leaves the runner.
# mode=devnet (environment devnet, signer kms) deploys on devnet Asset Hub through its public ETH-RPC
# (variable ETH_RPC_URL overrides) with the key contract-deployer-devnet, recorded as pcf-devnet-ci so the
# devnet instance's record is never touched. It needs allow_redeploy: devnet has CONTRACT_ADDRESS.
# The production environment requires reviewer approval before the job starts.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [devnet, production]
        required: true
      signer:
        description: kms (ETH-RPC, Cloud KMS) or mnemonic (Substrate, DEPLOYER_MNEMONIC)
        type: choice
        options: [kms, mnemonic]
        default: kms
      mode:
        description: fork (rehearsal on a fork of Polkadot Asset Hub, kms only), live, or devnet (kms CI run on devnet)
        type: choice
        options: [fork, live, devnet]
        default: fork
      dry_run:
        description: Estimate only, submit nothing (live, devnet)
        type: boolean
        default: true
      allow_redeploy:
        description: Deploy even if CONTRACT_ADDRESS is already set
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      NETWORK: ${{ inputs.mode == 'devnet' && 'pcf-devnet-ci' || inputs.environment }}
      SIGNER: ${{ inputs.signer }}
      MODE: ${{ inputs.mode }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
      ALLOW_REDEPLOY: ${{ inputs.allow_redeploy }}
      SUBSTRATE_WS_URL: ${{ vars.SUBSTRATE_WS_URL }}
      CONTRACT_ADDRESS: ${{ vars.CONTRACT_ADDRESS }}
      ETH_RPC_IMAGE: ${{ vars.ETH_RPC_IMAGE || 'docker.io/parity/eth-rpc:v1.24.2@sha256:74ebf6671d93e6ab759de4f84454b4d00be011530845b8edaaa83dbfc64c40c9' }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_LOCATION: ${{ vars.GCP_LOCATION }}
      GCP_KEY_RING: ${{ vars.GCP_KEY_RING }}
      GCP_KEY_NAME: ${{ inputs.mode == 'live' && 'contract-deployer' || inputs.mode == 'devnet' && 'contract-deployer-devnet' || 'contract-deployer-rehearsal' }}
      GCP_KEY_VERSION: ${{ vars.GCP_KEY_VERSION || '1' }}
    steps:
      - name: Check inputs
        run: |
          if [ "$SIGNER" = mnemonic ] && [ "$MODE" != live ]; then
            echo "::error::signer=mnemonic runs with mode=live only."
            exit 1
          fi
          if [ "$MODE" = fork ] && [ "$ENVIRONMENT" != production ]; then
            echo "::error::mode=fork forks Polkadot Asset Hub; run it in the production environment."
            exit 1
          fi
          if [ "$MODE" = devnet ] && { [ "$ENVIRONMENT" != devnet ] || [ "$SIGNER" != kms ]; }; then
            echo "::error::mode=devnet runs in the devnet environment with signer=kms."
            exit 1
          fi
          if [ "$MODE" = live ] && [ "$SIGNER" = kms ] && [ "$ENVIRONMENT" != production ]; then
            echo "::error::signer=kms on devnet runs as mode=devnet."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build PolkaVM bytecode
        run: npm run build:pvm

      - name: Check the PolkaVM bytecode hash
        run: npm run -s check:bytecode

      - name: Refuse a second instance
        if: env.CONTRACT_ADDRESS != '' && inputs.mode != 'fork'
        run: |
          ADDRESS="$CONTRACT_ADDRESS" npm run -s verify:deployment || true
          if [ "$DRY_RUN" != "1" ] && [ "$ALLOW_REDEPLOY" != "true" ]; then
            echo "::error::$ENVIRONMENT already has CONTRACT_ADDRESS=$CONTRACT_ADDRESS. Clients keep their records there; rerun with allow_redeploy only on purpose."
            exit 1
          fi

      - name: Deploy
        if: inputs.signer == 'mnemonic'
        env:
          DEPLOYER_MNEMONIC: ${{ secrets.DEPLOYER_MNEMONIC }}
        run: |
          if [ -z "$DEPLOYER_MNEMONIC" ]; then
            echo "::error::The $NETWORK environment has no DEPLOYER_MNEMONIC secret."
            exit 1
          fi
          npm run -s deploy:substrate

      - uses: foundry-rs/foundry-toolchain@v1
        if: inputs.signer == 'kms'
        with:
          version: v1.7.1

      - uses: google-github-actions/auth@v3
        if: inputs.signer == 'kms'
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Rehearse on a fork of Polkadot Asset Hub
        if: inputs.signer == 'kms' && inputs.mode == 'fork'
        env:
          DEPLOY_SIGNER: gcp
          DRY_RUN: "0"
          WORK_DIR: ${{ runner.temp }}/fork
        run: npm run -s rehearse:fork

      - name: Start eth-rpc
        if: inputs.signer == 'kms' && inputs.mode == 'live'
        run: |
          ws=${SUBSTRATE_WS_URL:-$(node -p 'require("./scripts/lib/revive-deploy").NETWORKS[process.env.NETWORK].wsUrl')}
          docker run -d --name eth-rpc --network host "$ETH_RPC_IMAGE" --node-rpc-url "$ws" --rpc-port 8545 --eth-pruning 1
          for _ in $(seq 1 120); do
            curl -fsS -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
              http://127.0.0.1:8545 && exit 0
            sleep 1
          done
          docker logs eth-rpc
          exit 1

      - name: Deploy through ETH-RPC
        if: inputs.signer == 'kms' && inputs.mode != 'fork'
        env:
          DEPLOY_SIGNER: gcp
          DEPLOY_MODE: live
          ETH_RPC_URL: ${{ inputs.mode == 'devnet' && (vars.ETH_RPC_URL || 'https://eth-rpc-testnet.polkadot.io') || 'http://127.0.0.1:8545' }}
          ETH_TIMEOUT: "300"
        run: npm run -s deploy:eth-rpc

      - name: Verify on chain
        if: env.DRY_RUN != '1' && inputs.mode != 'fork'
        run: npm run -s verify:deployment

      - name: Summary
        if: env.DRY_RUN != '1' && inputs.mode == 'live'
        run: |
          ADDRESS=$(jq -r .address "deployments/$NETWORK.json")
          {
            echo "### AccountDataStore on $NETWORK"
            echo ""
            echo '```json'
            cat "deployments/$NETWORK.json"
            echo '```'
            echo ""
            echo "Remote Config \`account_data_store_config\`: \`{\"contractAddress\":\"$ADDRESS\"}\`"
            echo ""
            echo "Set the \`$NETWORK\` environment variable \`CONTRACT_ADDRESS=$ADDRESS\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Devnet CI summary
        if: env.DRY_RUN != '1' && inputs.mode == 'devnet'
        run: |
          {
            echo "### AccountDataStore CI run on devnet, record $NETWORK (not the devnet instance)"
            echo ""
            echo '```json'
            cat "deployments/$NETWORK.json"
            echo '```'
            echo ""
            echo "Leave \`CONTRACT_ADDRESS\` and Remote Config unchanged."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fork summary
        if: inputs.mode == 'fork'
        run: |
          {
            echo "### AccountDataStore rehearsal on a fork of $NETWORK (not a deployment)"
            echo ""
            echo '```json'
            cat "$RUNNER_TEMP/fork/deployment-fork.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment record
        if: env.DRY_RUN != '1' && inputs.mode != 'fork'
        uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ env.NETWORK }}
          path: deployments/${{ env.NETWORK }}.json
          retention-days: 90

      - name: Upload fork rehearsal
        if: always() && inputs.mode == 'fork'
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-${{ inputs.environment }}-fork
          path: |
            ${{ runner.temp }}/fork/deployment-fork.json
            ${{ runner.temp }}/fork/*.log
          retention-days: 90
