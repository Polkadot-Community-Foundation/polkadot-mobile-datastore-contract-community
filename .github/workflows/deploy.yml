name: Deploy AccountDataStore

# One workflow, two GitHub environments, picked by `mode`: devnet runs in the devnet environment, live in
# production. Each environment holds its own deployer secret and endpoint variable, so a devnet run can never
# sign with the production key.
#   secret   DEPLOYER_MNEMONIC   sr25519 deployer (BIP-39), signer=mnemonic
#   variable SUBSTRATE_WS_URL    optional; overrides the network preset endpoint
#   variable CONTRACT_ADDRESS    set once deployed; blocks an accidental second instance
# signer=kms signs through ETH-RPC with a Cloud KMS key reached through workload identity:
#   variables GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT, GCP_PROJECT_ID, GCP_LOCATION,
#             GCP_KEY_RING, optional GCP_KEY_VERSION (default 1), optional ETH_RPC_IMAGE, optional ETH_RPC_URL (devnet)
# mode=devnet (default): devnet Asset Hub through its public ETH-RPC (variable ETH_RPC_URL overrides) with the
# key contract-deployer-devnet. A kms run records as pcf-devnet-ci so the devnet instance's record is never
# touched; it needs allow_redeploy because devnet has CONTRACT_ADDRESS. Any nonce is fine on devnet.
# mode=live: Polkadot Asset Hub with the key contract-deployer through an eth-rpc container started in the
# job against SUBSTRATE_WS_URL. The production environment requires reviewer approval before the job starts,
# and the deploy script refuses a key whose nonce 0 is not yet the DotNS factory. Run it after the DotNS live
# workflow and before the DotNS sweep of the key's balance: the deploy spends about 1.03 DOT.
# The deploy script retries a failed attempt (DEPLOY_ATTEMPTS, default 3) and never sends twice: the send is
# nonce-pinned and a retry first checks whether the earlier send landed. Inclusion and the record are read from
# Substrate, so the eth-rpc container only has to be up for the preflight and the send.
# No fork runs in CI: rehearse locally with scripts/rehearse-fork.sh.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: devnet (devnet Asset Hub, environment devnet) or live (Polkadot Asset Hub, environment production)
        type: choice
        options: [devnet, live]
        default: devnet
      signer:
        description: kms (ETH-RPC, Cloud KMS) or mnemonic (Substrate, DEPLOYER_MNEMONIC)
        type: choice
        options: [kms, mnemonic]
        default: kms
      dry_run:
        description: Estimate only, submit nothing
        type: boolean
        default: true
      allow_redeploy:
        description: Deploy even if CONTRACT_ADDRESS is already set
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Three attempts with their inclusion waits (ETH_TIMEOUT) and backoffs fit, with the build and the same-chain check.
    timeout-minutes: 45
    environment:
      name: ${{ inputs.mode == 'live' && 'production' || 'devnet' }}
    permissions:
      contents: read
      id-token: write
    env:
      ENVIRONMENT: ${{ inputs.mode == 'live' && 'production' || 'devnet' }}
      NETWORK: ${{ inputs.mode == 'live' && 'production' || inputs.signer == 'kms' && 'pcf-devnet-ci' || 'devnet' }}
      SIGNER: ${{ inputs.signer }}
      MODE: ${{ inputs.mode }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
      ALLOW_REDEPLOY: ${{ inputs.allow_redeploy }}
      SUBSTRATE_WS_URL: ${{ vars.SUBSTRATE_WS_URL }}
      CONTRACT_ADDRESS: ${{ vars.CONTRACT_ADDRESS }}
      ETH_RPC_IMAGE: ${{ vars.ETH_RPC_IMAGE || 'docker.io/parity/eth-rpc:v1.24.2@sha256:74ebf6671d93e6ab759de4f84454b4d00be011530845b8edaaa83dbfc64c40c9' }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_LOCATION: ${{ vars.GCP_LOCATION }}
      GCP_KEY_RING: ${{ vars.GCP_KEY_RING }}
      GCP_KEY_NAME: ${{ inputs.mode == 'live' && 'contract-deployer' || 'contract-deployer-devnet' }}
      GCP_KEY_VERSION: ${{ vars.GCP_KEY_VERSION || '1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build PolkaVM bytecode
        run: npm run build:pvm

      - name: Check the PolkaVM bytecode hash
        run: npm run -s check:bytecode

      - name: Refuse a second instance
        if: env.CONTRACT_ADDRESS != ''
        run: |
          ADDRESS="$CONTRACT_ADDRESS" npm run -s verify:deployment || true
          if [ "$DRY_RUN" != "1" ] && [ "$ALLOW_REDEPLOY" != "true" ]; then
            echo "::error::$ENVIRONMENT already has CONTRACT_ADDRESS=$CONTRACT_ADDRESS. Clients keep their records there; rerun with allow_redeploy only on purpose."
            exit 1
          fi

      - name: Deploy
        if: inputs.signer == 'mnemonic'
        env:
          DEPLOYER_MNEMONIC: ${{ secrets.DEPLOYER_MNEMONIC }}
        run: |
          if [ -z "$DEPLOYER_MNEMONIC" ]; then
            echo "::error::The $ENVIRONMENT environment has no DEPLOYER_MNEMONIC secret."
            exit 1
          fi
          npm run -s deploy:substrate

      - uses: foundry-rs/foundry-toolchain@v1
        if: inputs.signer == 'kms'
        with:
          version: v1.7.1

      - uses: google-github-actions/auth@v3
        if: inputs.signer == 'kms'
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Start eth-rpc
        if: inputs.signer == 'kms' && inputs.mode == 'live'
        run: |
          ws=${SUBSTRATE_WS_URL:-$(node -p 'require("./scripts/lib/revive-deploy").NETWORKS[process.env.NETWORK].wsUrl')}
          # --eth-pruning N keeps the last N blocks of receipts in memory (blocks themselves come from the node).
          # The deploy script reads inclusion from Substrate; N > 1 leaves the receipt readable for a while after.
          docker run -d --name eth-rpc --network host "$ETH_RPC_IMAGE" --node-rpc-url "$ws" --rpc-port 8545 --eth-pruning 32
          for _ in $(seq 1 120); do
            curl -fsS -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
              http://127.0.0.1:8545 && exit 0
            sleep 1
          done
          docker logs eth-rpc
          exit 1

      - name: Deploy through ETH-RPC
        if: inputs.signer == 'kms'
        env:
          DEPLOY_SIGNER: gcp
          DEPLOY_MODE: ${{ inputs.mode }}
          ETH_RPC_URL: ${{ inputs.mode == 'live' && 'http://127.0.0.1:8545' || vars.ETH_RPC_URL || 'https://eth-rpc-testnet.polkadot.io' }}
          ETH_TIMEOUT: "300"
        run: npm run -s deploy:eth-rpc

      - name: Verify on chain
        if: env.DRY_RUN != '1'
        run: npm run -s verify:deployment

      - name: Summary
        if: env.DRY_RUN != '1' && env.NETWORK != 'pcf-devnet-ci'
        run: |
          ADDRESS=$(jq -r .address "deployments/$NETWORK.json")
          {
            echo "### AccountDataStore on $NETWORK"
            echo ""
            echo '```json'
            cat "deployments/$NETWORK.json"
            echo '```'
            echo ""
            jq -r 'if .cost then "Deployer \(.deployer.ss58) spent \(.cost.spent) planck (`cost.spent`, \(.cost.decimals) decimals) in \(.attempts) attempt(s)." else "Deployer \(.deployer.ss58)." end' "deployments/$NETWORK.json"
            echo ""
            echo "Remote Config \`account_data_store_config\`: \`{\"contractAddress\":\"$ADDRESS\"}\`"
            echo ""
            echo "Set the \`$NETWORK\` environment variable \`CONTRACT_ADDRESS=$ADDRESS\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Devnet CI summary
        if: env.DRY_RUN != '1' && env.NETWORK == 'pcf-devnet-ci'
        run: |
          {
            echo "### AccountDataStore CI run on devnet, record $NETWORK (not the devnet instance)"
            echo ""
            echo '```json'
            cat "deployments/$NETWORK.json"
            echo '```'
            echo ""
            echo "Leave \`CONTRACT_ADDRESS\` and Remote Config unchanged."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment record
        if: env.DRY_RUN != '1'
        uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ env.NETWORK }}
          path: deployments/${{ env.NETWORK }}.json
          retention-days: 90
